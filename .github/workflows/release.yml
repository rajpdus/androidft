name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15          # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4
      - name: Install libmtp
        run: brew install libmtp
      - name: Build app bundle
        run: ./scripts/release.sh "${GITHUB_REF_NAME#v}"
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "AndroidFT $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" build/AndroidFT-*.zip build/SHA256SUMS.txt --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidFT
          path: build/AndroidFT-*.zip
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install libmtp
      - run: swift build
      - run: swift test        # device test skips when no phone is attached
